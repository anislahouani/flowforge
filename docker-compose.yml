services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flowforge-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: flowforge-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend